        <h1>GeoServer MCP</h1>
        <p>
          GeoServer MCP (also known as GeoServer Cloud MCP,
          <code>geoservercloud-mcp</code>) is a Model Context Protocol server
          that lets AI assistants like Claude manage GeoServer through natural
          language. It exposes 80+ GeoServer REST operations — workspaces,
          datastores, layers, styles, coverage stores, WMS/WMTS cascading, layer
          groups, security and ACL — as MCP tools.
        </p>
        <p>
          Install with <code>pip install geoservercloud-mcp</code> or add it to
          Claude Code with
          <code>claude mcp add geoserver -- uvx geoservercloud-mcp</code>.
        </p>
