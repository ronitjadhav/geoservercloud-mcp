name: Publish

on:
  push:
    branches:
      - master # -> dev pre-release (X.Y.Z.devN)
    tags:
      - "v*" # -> stable release (version from pyproject.toml)

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing (no stored token)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install
        run: poetry install
      - name: Tests
        run: poetry run pytest -q
      - name: Set dev version for non-tag builds
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: poetry version "$(poetry version -s).dev${{ github.run_number }}"
      - name: Build
        run: poetry build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
